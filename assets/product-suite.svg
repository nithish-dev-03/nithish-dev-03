<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Browser Product Suite</title>
  <desc id="desc">Animated visual showing Tabix, Devoza, and Flowza as organize, understand, and automate layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" stroke="#243044" stroke-width="1" opacity="0.35"/>
    </pattern>
    <style>
      .title{font:800 32px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC;letter-spacing:.2px}
      .eyebrow{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#67E8F9;letter-spacing:2.8px}
      .card-title{font:800 24px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}
      .card-sub{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#CBD5E1}
      .tag{font:700 11px JetBrains Mono,Consolas,monospace;fill:#94A3B8;letter-spacing:1px}
      .flow{font:800 13px JetBrains Mono,Consolas,monospace;fill:#0B1224;letter-spacing:1.5px}
      @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes floatB{0%,100%{transform:translateY(-5px)}50%{transform:translateY(6px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-240}}
      .a{animation:floatA 5s ease-in-out infinite;transform-origin:center}
      .b{animation:floatB 5.5s ease-in-out infinite;transform-origin:center}
      .p{animation:pulse 2.8s ease-in-out infinite}
      .line{stroke-dasharray:10 12;animation:dash 8s linear infinite}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1030" cy="80" r="180" fill="#22D3EE" opacity="0.08"/>
  <circle cx="155" cy="302" r="160" fill="#8B5CF6" opacity="0.08"/>

  <text x="60" y="72" class="eyebrow">BROWSER PRODUCT SUITE</text>
  <text x="60" y="112" class="title">Organize work. Understand interfaces. Automate execution.</text>
  <text x="60" y="144" class="card-sub">Three Chrome MV3 products designed around real developer and browser workflows.</text>

  <path class="line" d="M340 226H430" stroke="url(#cyan)" stroke-width="3" opacity=".8"/>
  <path class="line" d="M770 226H860" stroke="url(#violet)" stroke-width="3" opacity=".8"/>

  <g class="a">
    <rect x="80" y="182" width="260" height="118" rx="22" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".75"/>
    <circle cx="116" cy="220" r="18" fill="#22D3EE" opacity=".18"/>
    <path d="M108 220h16M116 212v16" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
    <text x="148" y="216" class="card-title">Tabix</text>
    <text x="148" y="242" class="card-sub">Keyboard-first tab command center</text>
    <rect x="148" y="260" width="102" height="24" rx="12" fill="#07111F" stroke="#334155"/>
    <text x="163" y="276" class="tag">ORGANIZE</text>
  </g>

  <g class="b">
    <rect x="470" y="168" width="300" height="146" rx="26" fill="#0B1224" stroke="#A5B4FC" stroke-opacity=".9" filter="url(#glow)"/>
    <circle cx="512" cy="215" r="20" fill="#8B5CF6" opacity=".2"/>
    <path d="M502 215h20M512 205v20" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>
    <text x="546" y="210" class="card-title">Devoza</text>
    <text x="546" y="238" class="card-sub">Live website intelligence & UI export</text>
    <rect x="546" y="260" width="126" height="26" rx="13" fill="#111827" stroke="#475569"/>
    <text x="562" y="278" class="tag">UNDERSTAND</text>
  </g>

  <g class="a">
    <rect x="860" y="182" width="260" height="118" rx="22" fill="#0F172A" stroke="#8B5CF6" stroke-opacity=".75"/>
    <circle cx="898" cy="220" r="18" fill="#8B5CF6" opacity=".18"/>
    <path d="M890 220h16M906 220l-8-8M906 220l-8 8" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="930" y="216" class="card-title">Flowza</text>
    <text x="930" y="242" class="card-sub">AI sidepanel, memory, workflows</text>
    <rect x="930" y="260" width="112" height="24" rx="12" fill="#07111F" stroke="#334155"/>
    <text x="946" y="276" class="tag">AUTOMATE</text>
  </g>

  <g class="p">
    <rect x="447" y="211" width="52" height="30" rx="15" fill="url(#cyan)"/>
    <text x="460" y="231" class="flow">MV3</text>
    <rect x="792" y="211" width="48" height="30" rx="15" fill="url(#violet)"/>
    <text x="804" y="231" class="flow">AI</text>
  </g>
</svg>
