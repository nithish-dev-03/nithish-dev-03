<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Nithish — Product Engineer</title>
<desc id="desc">Animated engineering portfolio banner</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A12"/><stop offset=".48" stop-color="#0B1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#67E8F9" stop-opacity=".32"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<circle cx="970" cy="90" r="220" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="970;1030;970" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="315" r="130" fill="#8B5CF6" opacity=".10" filter="url(#blur)"><animate attributeName="cy" values="315;260;315" dur="7s" repeatCount="indefinite"/></circle>
<g transform="translate(76 66)">
  <rect width="220" height="34" rx="17" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".45"/>
  <circle cx="20" cy="17" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="36" y="22" fill="#A7F3D0" font-size="13" font-family="Inter,Segoe UI,sans-serif" letter-spacing="1.2">AVAILABLE TO BUILD</text>
</g>
<text x="76" y="158" fill="#F8FAFC" font-size="58" font-weight="750" font-family="Inter,Segoe UI,sans-serif">Nirmal Sing Nithish</text>
<text x="78" y="207" fill="url(#line)" font-size="25" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Product Engineer · Frontend Architecture · Browser AI</text>
<text x="78" y="258" fill="#94A3B8" font-size="18" font-family="Inter,Segoe UI,sans-serif">I design systems, ship cross-platform products, and turn complex workflows</text>
<text x="78" y="286" fill="#94A3B8" font-size="18" font-family="Inter,Segoe UI,sans-serif">into fast, focused experiences for web, mobile, and the browser.</text>
<g transform="translate(78 330)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">
  <rect width="142" height="34" rx="8" fill="#111827" stroke="#334155"/><text x="16" y="22" fill="#67E8F9">REACT / TS</text>
  <rect x="154" width="128" height="34" rx="8" fill="#111827" stroke="#334155"/><text x="170" y="22" fill="#A5B4FC">FLUTTER</text>
  <rect x="294" width="152" height="34" rx="8" fill="#111827" stroke="#334155"/><text x="310" y="22" fill="#C4B5FD">CHROME MV3</text>
  <rect x="458" width="118" height="34" rx="8" fill="#111827" stroke="#334155"/><text x="474" y="22" fill="#6EE7B7">NODE.JS</text>
</g>
<g fill="none" stroke-linecap="round">
  <path d="M850 147C918 94 1017 112 1065 177S1075 319 997 340" stroke="#334155" stroke-width="2"/>
  <path d="M836 265C905 318 1003 302 1054 241" stroke="#334155" stroke-width="2"/>
  <circle cx="850" cy="147" r="9" fill="#0B1020" stroke="#22D3EE" stroke-width="3"><animate attributeName="r" values="7;11;7" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1065" cy="177" r="9" fill="#0B1020" stroke="#818CF8" stroke-width="3"><animate attributeName="r" values="11;7;11" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="997" cy="340" r="9" fill="#0B1020" stroke="#C084FC" stroke-width="3"><animate attributeName="r" values="7;11;7" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="836" cy="265" r="9" fill="#0B1020" stroke="#34D399" stroke-width="3"/>
  <circle r="5" fill="#F8FAFC"><animateMotion dur="5s" repeatCount="indefinite" path="M850 147C918 94 1017 112 1065 177S1075 319 997 340"/></circle>
</g>
</svg>